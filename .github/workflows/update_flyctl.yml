name: Update flyctl
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: chainguard-dev/actions/setup-gitsign@58b5d1b6769b7e88dfa5c85bbc81a5a02eaca5bc
#    - name: Change ownership of flyctl directory
#      run: |
#        sudo chown -R 1000 flyctl
    - uses: mutantmonkey/geschenkerbauer/actions/pkgctl-update@b58ae2d590f4dd1d0f33ee69bdf9e9225bf361fd
      with:
        pkgbase: flyctl
    - name: Create Git commit
      run: |
        git add flyctl
        git commit -m "Update to latest version of flyctl"
    - name: Push changes
      run: git push
