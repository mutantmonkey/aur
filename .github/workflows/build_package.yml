name: Build package
on:
  workflow_dispatch:
    inputs:
      pkgname:
        description: "Package to build"
        required: true
      nodeps:
        description: "Skip dependency checks (use 1 to disable dependency checks)"
        required: false
permissions:
  id-token: write
  contents: read
  attestations: write
  artifact-metadata: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: buildsrc
    - name: Prepare build environment
      run: |
        sudo install -d -o 1000 -g users repo
    - name: Use geschenkerbauer to build packages
      uses: mutantmonkey/geschenkerbauer/action@dc293d835e5dbe1d62e13c02443c7387f7da7728 # main
      env:
        BUILDSRC: ${{ github.workspace }}/buildsrc
        PKGDEST: ${{ github.workspace }}/repo
        PACKAGER: geschenkerbauer on github <archpkgs+github@mutantmonkey.mx>
      with:
        packages: ${{ github.event.inputs.pkgname }}
        nodeps: ${{ github.event.inputs.nodeps }}
    - name: Replace forbidden colon character in package filenames
      run: |
        for f in $(find . -iname '*:*'); do
          sudo mv "$f" "${f/:/__3A__}"
        done || exit 0
      working-directory: ./repo
    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: output
        path: repo
    - name: Generate artifact attestation
      uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
      with:
        subject-path: 'repo/*'
